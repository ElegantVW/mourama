plugins {
    id "com.android.application"
}
android {
    namespace "com.elegantvw.mourama"
    compileSdk 34
    defaultConfig {
        applicationId "com.elegantvw.mourama"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
