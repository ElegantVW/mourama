[package]
name = "mourama-play"
version = "0.1.0"
edition = "2021"
description = "Mourama native client — Linux, Windows, later Android."
license = "MIT"
publish = false

[[bin]]
name = "mourama-play"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
